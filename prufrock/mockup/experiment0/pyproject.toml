[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prufrock"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "python-telegram-bot>=21.0,<22",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "apscheduler>=3.10,<4",
    "pydantic-settings>=2.3,<3",
    "psycopg[binary]>=3.1,<4",
    "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "pyright>=1.1",
    "testcontainers[postgres]>=4.4",
]

[project.scripts]
prufrock = "prufrock.cli:app"
prufrock-bot = "prufrock.bot.runner:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"
reportMissingImports = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--tb=short"
