<svg viewBox="0 0 1040 1290" xmlns="http://www.w3.org/2000/svg" style="--bg:#FFFFFF;--panel:#FFFFFF;--band:#F4F7FC;--rail:#F7F9FD;--stroke:#C3D0E4;--ink:#0B1424;--mut:#0B1424;--dim:#5B6E8C;--glyph:#FFFFFF" role="img" aria-label="DRIVE: Decide, Request, Iterate, Validate, Evolve"><rect x="0" y="0" width="1040" height="1290" fill="var(--bg)"/><rect x="36" y="64" width="968" height="1162" rx="18" fill="var(--panel)" stroke="var(--stroke)" stroke-width="1.6"/><path d="M36 82 A18 18 0 0 1 54 64 L986 64 A18 18 0 0 1 1004 82 L1004 204 L36 204 Z" fill="var(--band)"/><rect x="36" y="204" width="164" height="1022" fill="var(--rail)"/><path d="M36 204 L36 1208 A18 18 0 0 0 54 1226 L200 1226 L200 204 Z" fill="var(--rail)"/><line x1="36" y1="204" x2="1004" y2="204" stroke="var(--stroke)" stroke-width="1.2"/><text x="76" y="152" font-family='Poppins, Inter, "Segoe UI", Helvetica, Arial, sans-serif' font-size="54" font-weight="700" fill="var(--ink)" letter-spacing="0.06em">DRIVE</text><circle cx="118" cy="303" r="39" fill="#2D70EC"/><text x="118" y="318" font-family='Poppins, Inter, "Segoe UI", Helvetica, Arial, sans-serif' font-size="42" font-weight="700" fill="var(--glyph)" text-anchor="middle" letter-spacing="0.02em">D</text><text x="240" y="300" font-family='Poppins, Inter, "Segoe UI", Helvetica, Arial, sans-serif' font-size="31" font-weight="700" fill="var(--mut)">Decide</text><text x="240" y="338" font-family='Poppins, Inter, "Segoe UI", Helvetica, Arial, sans-serif' font-size="19" font-weight="400" fill="var(--dim)">What does “done” mean?</text><line x1="240" y1="405" x2="964" y2="405" stroke="var(--stroke)" stroke-width="1"/><circle cx="118" cy="508" r="39" fill="#2B8276"/><text x="118" y="523" font-family='Poppins, Inter, "Segoe UI", Helvetica, Arial, sans-serif' font-size="42" font-weight="700" fill="var(--glyph)" text-anchor="middle" letter-spacing="0.02em">R</text><text x="240" y="505" font-family='Poppins, Inter, "Segoe UI", Helvetica, Arial, sans-serif' font-size="31" font-weight="700" fill="var(--mut)">Request</text><text x="240" y="543" font-family='Poppins, Inter, "Segoe UI", Helvetica, Arial, sans-serif' font-size="19" font-weight="400" fill="var(--dim)">intent, context, assumptions, success criteria</text><line x1="240" y1="610" x2="964" y2="610" stroke="var(--stroke)" stroke-width="1"/><circle cx="118" cy="713" r="39" fill="#A46A13"/><text x="118" y="728" font-family='Poppins, Inter, "Segoe UI", Helvetica, Arial, sans-serif' font-size="42" font-weight="700" fill="var(--glyph)" text-anchor="middle" letter-spacing="0.02em">I</text><text x="240" y="710" font-family='Poppins, Inter, "Segoe UI", Helvetica, Arial, sans-serif' font-size="31" font-weight="700" fill="var(--mut)">Iterate</text><text x="240" y="748" font-family='Poppins, Inter, "Segoe UI", Helvetica, Arial, sans-serif' font-size="19" font-weight="400" fill="var(--dim)">stay in the loop and steer it</text><line x1="240" y1="815" x2="964" y2="815" stroke="var(--stroke)" stroke-width="1"/><circle cx="118" cy="918" r="39" fill="#CD456C"/><text x="118" y="933" font-family='Poppins, Inter, "Segoe UI", Helvetica, Arial, sans-serif' font-size="42" font-weight="700" fill="var(--glyph)" text-anchor="middle" letter-spacing="0.02em">V</text><text x="240" y="915" font-family='Poppins, Inter, "Segoe UI", Helvetica, Arial, sans-serif' font-size="31" font-weight="700" fill="var(--mut)">Validate</text><text x="240" y="953" font-family='Poppins, Inter, "Segoe UI", Helvetica, Arial, sans-serif' font-size="19" font-weight="400" fill="var(--dim)">confirm against done and success criteria</text><line x1="240" y1="1020" x2="964" y2="1020" stroke="var(--stroke)" stroke-width="1"/><circle cx="118" cy="1123" r="39" fill="#2B8656"/><text x="118" y="1138" font-family='Poppins, Inter, "Segoe UI", Helvetica, Arial, sans-serif' font-size="42" font-weight="700" fill="var(--glyph)" text-anchor="middle" letter-spacing="0.02em">E</text><text x="240" y="1120" font-family='Poppins, Inter, "Segoe UI", Helvetica, Arial, sans-serif' font-size="31" font-weight="700" fill="var(--mut)">Evolve</text><text x="240" y="1158" font-family='Poppins, Inter, "Segoe UI", Helvetica, Arial, sans-serif' font-size="19" font-weight="400" fill="var(--dim)">debrief, then update tooling, context, and practice</text></svg>